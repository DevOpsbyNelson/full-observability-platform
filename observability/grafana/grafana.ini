[server]
protocol = http
domain = $__env{GF_SERVER_ROOT_URL} # https://yourdomain.com/
root_url = $__env{GF_SERVER_ROOT_URL}/ # https://yourdomain.com/
serve_from_sub_path = false

[auth]
disable_login_form = $__env{GF_AUTH_DISABLE_LOGIN_FORM} # true or false

[auth.github]
enabled = true
allow_sign_up = true
auto_login = false
client_id = $__env{GF_AUTH_GITHUB_CLIENT_ID}
client_secret = $__env{GF_AUTH_GITHUB_CLIENT_SECRET}
allowed_organizations = $__env{GF_AUTH_GITHUB_ORG}
scopes = user:email,read:org
role_attribute_path = contains(organizations[*].login, $__env{GF_AUTH_GITHUB_ORG}) && contains(organizations[*].role, "admin") && "Admin" || contains(organizations[*].login, $__env{GF_AUTH_GITHUB_ORG}) && "Editor" || "Viewer"
role_attribute_strict = false